version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: careerforge_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CareerForge123
      POSTGRES_DB: careerforge_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: